<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Resser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #F4F4EF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .splash-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .splash-tagline {
      font-size: 1rem;
      color: #5F5F58;
      line-height: 1.5;
    }
    .splash-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #10B981;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 13px 32px;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .splash-btn:hover { background: #059669; }
  </style>
</head>
<body>
  <div class="splash">
    <!-- Inline SVG logo — large version -->
    <div class="splash-logo">
      <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" width="56" height="56">
        <circle cx="28" cy="28" r="28" fill="#ECFDF5"/>
        <path d="M20 38C15 33 14 27 16 22C20 15 28 12 35 12C32 19 29 25 27 30C25 35 23 40 20 38Z" fill="#10B981"/>
        <path d="M20 38C23 32 26 27 28 22" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <svg viewBox="0 0 120 36" xmlns="http://www.w3.org/2000/svg" width="120" height="36">
        <text x="0" y="27" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1A1A18" letter-spacing="-0.5">Resser</text>
      </svg>
    </div>

    <p class="splash-tagline">
      Votre assistant de recyclage éco-responsable.<br>
      Scannez, identifiez, recyclez.
    </p>

    <a href="/home" class="splash-btn">
      Commencer
    </a>
  </div>
</body>
</html>
