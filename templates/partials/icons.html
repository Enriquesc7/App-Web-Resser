{% macro icon(name, size=24, class='') %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"{% if class %} class="{{ class }}"{% endif %} aria-hidden="true">
{% if name == 'home' %}
  <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
  <polyline points="9 22 9 12 15 12 15 22"/>
{% elif name == 'barcode' %}
  <path d="M3 5v14M6 5v14" stroke-width="1.5"/>
  <path d="M9 5v14" stroke-width="3"/>
  <path d="M12 5v14" stroke-width="1"/>
  <path d="M14 5v14" stroke-width="1.5"/>
  <path d="M17 5v14" stroke-width="3"/>
  <path d="M20 5v14" stroke-width="1"/>
  <path d="M22 5v14" stroke-width="1.5"/>
{% elif name == 'receipt' %}
  <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/>
  <line x1="9" y1="8" x2="15" y2="8"/>
  <line x1="9" y1="12" x2="16" y2="12"/>
  <line x1="9" y1="16" x2="13" y2="16"/>
{% elif name == 'location' %}
  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
  <circle cx="12" cy="10" r="3"/>
{% elif name == 'shopping' %}
  <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
  <line x1="3" y1="6" x2="21" y2="6"/>
  <path d="M16 10a4 4 0 01-8 0"/>
{% elif name == 'library' %}
  <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/>
  <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
{% elif name == 'camera' %}
  <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
  <circle cx="12" cy="13" r="4"/>
{% elif name == 'upload' %}
  <polyline points="16 16 12 12 8 16"/>
  <line x1="12" y1="12" x2="12" y2="21"/>
  <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/>
{% elif name == 'chevron-right' %}
  <polyline points="9 18 15 12 9 6"/>
{% elif name == 'chevron-left' %}
  <polyline points="15 18 9 12 15 6"/>
{% elif name == 'chevron-down' %}
  <polyline points="6 9 12 15 18 9"/>
{% elif name == 'check' %}
  <polyline points="20 6 9 17 4 12"/>
{% elif name == 'x' %}
  <line x1="18" y1="6" x2="6" y2="18"/>
  <line x1="6" y1="6" x2="18" y2="18"/>
{% elif name == 'info' %}
  <circle cx="12" cy="12" r="10"/>
  <line x1="12" y1="8" x2="12" y2="12"/>
  <line x1="12" y1="16" x2="12.01" y2="16"/>
{% elif name == 'alert-triangle' %}
  <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
  <line x1="12" y1="9" x2="12" y2="13"/>
  <line x1="12" y1="17" x2="12.01" y2="17"/>
{% elif name == 'recycle' %}
  <path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/>
  <path d="M21 3v5h-5"/>
  <path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/>
  <path d="M8 16H3v5"/>
{% elif name == 'leaf' %}
  <path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/>
  <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
{% elif name == 'user' %}
  <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
  <circle cx="12" cy="7" r="4"/>
{% elif name == 'settings' %}
  <circle cx="12" cy="12" r="3"/>
  <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
{% elif name == 'search' %}
  <circle cx="11" cy="11" r="8"/>
  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
{% elif name == 'plus' %}
  <line x1="12" y1="5" x2="12" y2="19"/>
  <line x1="5" y1="12" x2="19" y2="12"/>
{% elif name == 'trash' %}
  <polyline points="3 6 5 6 21 6"/>
  <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
{% elif name == 'edit' %}
  <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
  <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
{% endif %}
</svg>
{% endmacro %}
